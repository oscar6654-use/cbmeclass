/* ---------------- 輔助函式 ---------------- */
var $ = function(sel, ctx){ return (ctx||document).querySelector(sel); };
var $$ = function(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); };

function esc(s){
  var div = document.createElement('div');
  div.textContent = s==null ? '' : String(s);
  return div.innerHTML;
}

function parseDate(str){
  if(!str) return null;
  var d = new Date(str+'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

var WEEKDAY_LABELS = ['日','一','二','三','四','五','六'];

/* ---------------- 課表篩選與渲染 ---------------- */
var SCHEDULE_FILTERS = [
  {key:'醫五', label:'醫五'},
  {key:'醫六', label:'醫六'},
  {key:'all', label:'全部（含醫六／停課）'}
];
var currentScheduleFilter = '醫五';
var currentScheduleSearch = '';

function renderScheduleChips(){
  var wrap = $('#scheduleChips');
  wrap.innerHTML = '';
  SCHEDULE_FILTERS.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (c.key===currentScheduleFilter?' active':'');
    b.textContent = c.label;
    b.type='button';
    b.setAttribute('aria-pressed', c.key===currentScheduleFilter ? 'true':'false');
    b.addEventListener('click', function(){
      currentScheduleFilter = c.key;
      renderScheduleChips();
      renderSchedule();
    });
    wrap.appendChild(b);
  });
}

function scheduleRowMatches(row){
  var okAudience = currentScheduleFilter==='all' || row.audience===currentScheduleFilter || row.audience==='全體' || (currentScheduleFilter==='醫五' && row.audience==null);
  var q = currentScheduleSearch.trim().toLowerCase();
  var hay = [row.date,row.unit,row.topic,row.teacher,row.place,row.time].filter(Boolean).join(' ').toLowerCase();
  var okSearch = !q || hay.indexOf(q)!==-1;
  return okAudience && okSearch;
}

function fmtScheduleDate(dateStr){
  var d = parseDate(dateStr);
  if(!d) return dateStr;
  return dateStr + '（週' + WEEKDAY_LABELS[d.getDay()] + '）';
}

function renderSchedule(){
  var wrap = $('#scheduleList');
  var list = SCHEDULE.filter(scheduleRowMatches);
  $('#scheduleResultCount').textContent = '共找到 '+list.length+' 筆課程紀錄（全表共 '+SCHEDULE.length+' 筆）';
  wrap.innerHTML = '';
  if(!list.length){
    wrap.innerHTML = '<p class="sched-empty">沒有符合條件的課程，試試清除搜尋或切換篩選。</p>';
    return;
  }
  var groups = [];
  var groupMap = {};
  list.forEach(function(row){
    var key = row.date || '（日期未標明）';
    if(!groupMap[key]){ groupMap[key] = []; groups.push(key); }
    groupMap[key].push(row);
  });
  groups.forEach(function(dateKey){
    var rows = groupMap[dateKey];
    var card = document.createElement('div');
    card.className = 'sched-day';
    var rowsHtml = rows.map(function(r){
      if(r.time==='停課'){
        return '<tr class="sched-holiday"><td colspan="5">'+esc(r.topic)+'</td></tr>';
      }
      var badge = r.audience==='醫五' ? '<span class="sched-badge med5">醫五</span>'
        : r.audience==='醫六' ? '<span class="sched-badge med6">醫六</span>'
        : r.audience==='全體' ? '<span class="sched-badge all">全體</span>' : '';
      return '<tr>'+
        '<td class="sched-time">'+esc(r.time)+'</td>'+
        '<td>'+badge+'</td>'+
        '<td>'+esc(r.unit)+'</td>'+
        '<td>'+esc(r.topic)+(r.teacher?'（'+esc(r.teacher)+'）':'')+'</td>'+
        '<td>'+esc(r.place)+'</td>'+
      '</tr>';
    }).join('');
    card.innerHTML =
      '<div class="sched-day-head"><span class="sched-date">'+esc(fmtScheduleDate(dateKey))+'</span></div>'+
      '<table class="sched-table"><thead><tr><th>時間</th><th>對象</th><th>科部／單位</th><th>主題（教師）</th><th>地點</th></tr></thead>'+
      '<tbody>'+rowsHtml+'</tbody></table>';
    wrap.appendChild(card);
  });
}

function init(){
  renderScheduleChips();
  renderSchedule();

  var scheduleSearch = $('#scheduleSearch');
  scheduleSearch.addEventListener('input', function(){
    currentScheduleSearch = scheduleSearch.value;
    renderSchedule();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
